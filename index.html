const $=s=>document.querySelector(s), shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const state={game:'match',round:0,score:0,selected:null,matched:new Set(),flipped:[],busy:false,answered:false,order:[],choices:[],roundItems:[]};
function add(n){state.score+=n;$('#score').textContent='⭐ '+state.score+' points'}
function init(game){state.game=game;state.round=0;state.selected=null;state.matched=new Set();state.flipped=[];state.busy=false;state.answered=false;state.order=game==='quiz'?shuffle([...Array(12).keys()]):[];document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.game===game));render()}
function header(title,desc,total){return `<div class="heading"><div><h2>${title}</h2><p class="instructions">${desc}</p></div><span class="counter">Round ${state.round+1} / ${total}</span></div><div class="bar"><div class="fill" style="width:${state.round/total*100}%"></div></div>`}
function finished(total){$('#app').innerHTML=`<div class="result"><div class="confetti">★</div><h2>Excellent work!</h2><p>You completed all ${total} rounds of ${state.game==='match'?'Match':state.game==='memory'?'Memory':'Choose'}.</p><button class="primary" id="again">Play again ↻</button> <button class="secondary" id="other">Try another game</button></div>`;$('#again').onclick=()=>init(state.game);$('#other').onclick=()=>init(state.game==='match'?'memory':state.game==='memory'?'quiz':'match')}
function render(){if(state.game==='match')matchRender();else if(state.game==='memory')memoryRender();else quizRender()}
function next(total){state.round++;state.selected=null;state.flipped=[];state.matched=new Set();state.answered=false;state.busy=false;if(state.round===total)finished(total);else render()}
function control(total,complete){return `<div class="actions"><button class="secondary" id="restart">Restart game ↻</button><button class="primary" id="next" ${complete?'':'disabled'}>${state.round===total-1?'Finish game':'Next round →'}</button></div>`}
function wire(total){$('#restart').onclick=()=>init(state.game);$('#next').onclick=()=>next(total)}
function matchRender(){if(state.round>=3)return finished(3);let ids=[0,1,2,3].map(x=>x+state.round*4);let words=shuffle(ids);state.roundItems=ids;state.matched=new Set();$('#app').innerHTML=header('Connect the pairs','Click a photo, then click its matching verb.',3)+`<div class="matching" id="matching"><div class="side">${ids.map(i=>`<button class="photo" data-id="${i}" data-type="photo" aria-label="Photo ${i+1}"><img src="${ITEMS[i].image}" alt="Action photo"></button>`).join('')}</div><svg class="lines" id="lines"></svg><div class="side">${words.map(i=>`<button class="word" data-id="${i}" data-type="word">${ITEMS[i].name}</button>`).join('')}</div></div><div class="status" id="status">0 of 4 pairs matched</div>`+control(3,false);wire(3);document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>selectMatch(b));}
function selectMatch(el){let id=+el.dataset.id,type=el.dataset.type;if(state.matched.has(id))return;let s=state.selected;if(!s){state.selected={id,type};el.classList.add('selected');return}if(s.type===type){document.querySelectorAll('.selected').forEach(e=>e.classList.remove('selected'));state.selected={id,type};el.classList.add('selected');return}document.querySelectorAll('.selected').forEach(e=>e.classList.remove('selected'));state.selected=null;if(id===s.id){state.matched.add(id);document.querySelectorAll(`[data-id="${id}"]`).forEach(e=>e.classList.add('done'));add(10);$('#status').textContent=`${state.matched.size} of 4 pairs matched · Correct!`;drawLines();if(state.matched.size===4){$('#next').disabled=false;$('#status').textContent='All correct! Go to the next round.'}}else{$('#status').textContent='Not quite. Try another pair!';el.classList.add('wrong');setTimeout(()=>el.classList.remove('wrong'),400)}}
function drawLines(){let box=$('#matching').getBoundingClientRect();let svg=$('#lines');svg.innerHTML='';for(let id of state.matched){let a=document.querySelector(`.photo[data-id="${id}"]`).getBoundingClientRect(),b=document.querySelector(`.word[data-id="${id}"]`).getBoundingClientRect();let x1=a.right-box.left,y1=(a.top+a.bottom)/2-box.top,x2=b.left-box.left,y2=(b.top+b.bottom)/2-box.top;svg.innerHTML+=`<path d="M ${x1} ${y1} C ${(x1+x2)/2} ${y1}, ${(x1+x2)/2} ${y2}, ${x2} ${y2}" stroke="#18a67a" stroke-width="4" fill="none" stroke-linecap="round"/>`}}window.addEventListener('resize',()=>{if(state.game==='match'&&$('#lines'))drawLines()});
function memoryRender(){if(state.round>=4)return finished(4);let ids=[0,4,8].map(n=>n+state.round);state.roundItems=ids;state.memoryDeck=shuffle(ids.flatMap(i=>[{id:i,type:'photo'},{id:i,type:'word'}]));state.flipped=[];state.matched=new Set();$('#app').innerHTML=header('Find the pairs','Turn over two cards. Match each photo to its verb.',4)+`<div class="memory-grid">${state.memoryDeck.map((c,j)=>`<button class="mem" data-index="${j}" aria-label="Card ${j+1}"><span>?</span></button>`).join('')}</div><div class="status" id="status">Find all 3 pairs.</div>`+control(4,false);wire(4);document.querySelectorAll('.mem').forEach(b=>b.onclick=()=>flip(+b.dataset.index))}
function showCard(index){let c=state.memoryDeck[index],el=document.querySelector(`.mem[data-index="${index}"]`);el.classList.add('revealed');el.innerHTML=c.type==='photo'?`<img src="${ITEMS[c.id].image}" alt="Action">`:`<span class="text-card">${ITEMS[c.id].name}</span>`}
function flip(index){if(state.busy||state.flipped.includes(index)||state.matched.has(index))return;showCard(index);state.flipped.push(index);if(state.flipped.length!==2)return;let [a,b]=state.flipped,c=state.memoryDeck[a],d=state.memoryDeck[b];if(c.id===d.id&&c.type!==d.type){state.matched.add(a);state.matched.add(b);document.querySelectorAll(`[data-index="${a}"],[data-index="${b}"]`).forEach(el=>el.classList.add('matched'));state.flipped=[];add(10);$('#status').textContent=`${state.matched.size/2} of 3 pairs found!`;if(state.matched.size===6){$('#next').disabled=false;$('#status').textContent='Perfect! Continue to the next column.'}}else{state.busy=true;$('#status').textContent='Try again!';setTimeout(()=>{[a,b].forEach(i=>{let el=document.querySelector(`.mem[data-index="${i}"]`);if(el&&!state.matched.has(i)){el.classList.remove('revealed');el.innerHTML='<span>?</span>'}});state.flipped=[];state.busy=false},850)}}
// The subject represents the principal person or people in each photograph.
const SUBJECTS=['They','She','He','He','She','He','They','They','She','She','He','They'];
const ING=['dancing','driving','listening to music','playing basketball','reading','riding a bike','running','shopping','studying','swimming','taking a walk','watching a movie'];
function quizOptions(id){
  const pronoun=SUBJECTS[id],aux=pronoun==='They'?'are':'is';
  const correct=`${pronoun} ${aux} ${ING[id]}`;
  const other=shuffle([...Array(12).keys()].filter(i=>i!==id))[0];
  // Combine a wrong action with a subject–verb agreement mistake.
  const wrongAction=`${pronoun} ${aux} ${ING[other]}`;
  const wrongAgreement=`${pronoun} ${aux==='is'?'are':'is'} ${ING[id]}`;
  return shuffle([{text:correct,correct:true},{text:wrongAction,correct:false},{text:wrongAgreement,correct:false}]);
}
function quizRender(){
  if(state.round>=12)return finished(12);
  let id=state.order[state.round];
  state.choices=quizOptions(id);
  state.answered=false;
  $('#app').innerHTML=header('Choose the correct sentence','Look at the photo. Choose the correct Present Continuous sentence.',12)
   +`<img class="quiz-picture" src="${ITEMS[id].image}" alt="Photo showing an everyday activity">`
   +`<div class="choices">${state.choices.map((option,i)=>`<button class="choice" data-index="${i}">${option.text}</button>`).join('')}</div>`
   +`<div class="status" id="status">Select one answer.</div>`+control(12,false);
  wire(12);
  document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(+b.dataset.index,b));
}
function answer(index,el){
  if(state.answered)return;
  state.answered=true;
  const chosen=state.choices[index],correct=state.choices.find(c=>c.correct);
  document.querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;if(state.choices[i].correct)b.classList.add('correct')});
  if(chosen.correct){add(10);$('#status').textContent='Correct! Well done.'}
  else{el.classList.add('incorrect');$('#status').textContent=`The correct sentence is “${correct.text}”.`}
  $('#next').disabled=false;
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>init(b.dataset.game));init('match');
</script></body></html>
